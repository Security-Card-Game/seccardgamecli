[package]
name = "game_lib"
version = "0.8.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rand = "0.10.2"
log = "0.4.33"
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
fake = { version = "5.1.0", features = ["derive", "dummy", "uuid"] }
rstest = "0.26.1"
quickcheck = "1.1.0"
quickcheck_macros = "1.2.0"